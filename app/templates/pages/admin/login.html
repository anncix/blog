<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - {{ options.site_name }}</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body login-body">
  <div class="login-card">
    <div class="text-center mb-4">
      <span class="brand-icon">A</span>
      <h4 class="mt-2">{{ options.site_name }}</h4>
      <p class="text-muted small">后台管理系统</p>
    </div>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form action="/admin/login" method="post">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">登 录</button>
    </form>
    <p class="text-center text-muted small mt-3 mb-0">默认账号 admin / admin123</p>
  </div>
</body>
</html>
