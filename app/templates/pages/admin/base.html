<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}后台管理{% endblock %} - {{ options.site_name }}</title>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  {% block head %}{% endblock %}
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span class="brand-icon">A</span>
        <span>{{ options.site_name }}</span>
      </div>
      <nav class="admin-nav">
        <a href="/admin" class="admin-nav-link">仪表盘</a>
        <a href="/admin/articles" class="admin-nav-link">文章管理</a>
        <a href="/admin/articles/new" class="admin-nav-link">写文章</a>
        <a href="/admin/comments" class="admin-nav-link">评论审核</a>
        <a href="/admin/pages" class="admin-nav-link">页面管理</a>
        <a href="/admin/settings" class="admin-nav-link">站点设置</a>
        <a href="/admin/links" class="admin-nav-link">友链管理</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="/" class="admin-nav-link" target="_blank">查看前台 ↗</a>
        <form action="/admin/logout" method="post" class="d-inline">
          <button type="submit" class="btn btn-sm btn-outline-danger w-100 mt-2">退出登录</button>
        </form>
      </div>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <h1 class="admin-title">{% block admin_title %}{% endblock %}</h1>
      </div>
      <div class="admin-content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/js/admin.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
