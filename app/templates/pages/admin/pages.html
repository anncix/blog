{% extends "pages/admin/base.html" %}
{% block title %}页面管理{% endblock %}
{% block admin_title %}页面管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-end mb-3">
  <a href="/admin/pages/new" class="btn btn-primary">新建页面</a>
</div>
<div class="card">
  <table class="table table-hover align-middle mb-0">
    <thead><tr><th>标题</th><th>别名</th><th>状态</th><th class="text-end">操作</th></tr></thead>
    <tbody>
      {% for p in pages %}
      <tr>
        <td>{{ p.title }}</td>
        <td><code>/page/{{ p.slug }}</code></td>
        <td>
          <span class="badge {{ 'text-bg-success' if p.status == 'published' else 'text-bg-secondary' }}">{{ p.status }}</span>
        </td>
        <td class="text-end">
          <a href="/admin/pages/{{ p.id }}/edit" class="btn btn-sm btn-outline-primary">编辑</a>
          <form action="/admin/pages/{{ p.id }}/delete" method="post" class="d-inline" onsubmit="return confirm('确定删除？')">
            <button class="btn btn-sm btn-outline-danger">删除</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-center text-muted py-4">暂无页面</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
