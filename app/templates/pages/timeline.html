{% extends "base.html" %}
{% block title %}时间轴 - {{ options.site_name }}{% endblock %}

{% block content %}
<div class="page-head">
  <h1 class="page-title">时间轴</h1>
</div>
<div class="timeline">
  {% for item in timeline %}
  <div class="timeline-item">
    <div class="timeline-dot"></div>
    <div class="timeline-date">{{ item.date }}</div>
    <div class="timeline-content">
      <a href="/article/{{ item.article.slug }}">{{ item.article.title }}</a>
    </div>
  </div>
  {% else %}
  <div class="card glass-card text-center py-5"><p class="text-muted mb-0">暂无内容</p></div>
  {% endfor %}
</div>
{% endblock %}
