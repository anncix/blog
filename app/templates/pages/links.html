{% extends "base.html" %}
{% block title %}友情链接 - {{ options.site_name }}{% endblock %}

{% block content %}
<div class="page-head">
  <h1 class="page-title">友情链接</h1>
</div>
<div class="row g-4">
  {% for link in friend_links %}
  <div class="col-md-6 col-lg-4">
    <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" class="card glass-card link-card text-decoration-none">
      <div class="card-body">
        <h5 class="link-name">{{ link.name }}</h5>
        {% if link.desc %}<p class="text-muted small mb-0">{{ link.desc }}</p>{% endif %}
        <span class="link-url small">{{ link.url }}</span>
      </div>
    </a>
  </div>
  {% else %}
  <div class="col-12"><div class="card glass-card text-center py-5"><p class="text-muted mb-0">暂无友链</p></div></div>
  {% endfor %}
</div>
{% endblock %}
